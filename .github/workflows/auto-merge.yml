name: Auto-merge on approval

# GitHub's native auto-merge needs GitHub Pro on private repos; this merges a PR
# as soon as a reviewer with write access approves it.
# ponytail: does not wait for CI; approve after checks are green.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
